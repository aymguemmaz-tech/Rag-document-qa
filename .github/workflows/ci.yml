name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Ruff (lint + format)
        run: |
          ruff check .
          ruff format --check .
      - name: Mypy
        run: mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ragqa
          POSTGRES_PASSWORD: ragqa
          POSTGRES_DB: ragqa
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ragqa" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      RAGQA_TEST_DATABASE_URL: postgresql://ragqa:ragqa@localhost:5432/ragqa
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Unit + pgvector integration tests
        run: pytest --cov=ragqa --cov-report=term-missing --cov-fail-under=85
